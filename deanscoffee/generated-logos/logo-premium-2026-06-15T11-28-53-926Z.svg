<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="#EFF6FF" rx="15"/>
  
  <!-- Logo icon/symbol -->
  <circle cx="150" cy="150" r="40" fill="url(#logoGradient)" filter="url(#logoShadow)"/>
  <circle cx="150" cy="150" r="25" fill="white" opacity="0.9"/>
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        text-anchor="middle" fill="#2563EB">
    D
  </text>
  
  <!-- Business name -->
  <text x="220" y="165" font-family="Arial, sans-serif" font-size="54" font-weight="600" 
        fill="url(#logoGradient)" filter="url(#logoShadow)">
    Dean's Coffee
  </text>
  
  <!-- Tagline -->
  <text x="220" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="300" 
        fill="#3B82F6" opacity="0.8">
    Professional Modern Solutions
  </text>
</svg>