</head>
<body>
  <header>
    <div class="nav-inner">
      <a href="../../index.html" class="brand"><img src="../../logo.png" alt="Pilgrimage Spaces logo" class="logo"><span class="brand-name">Pilgrimage Spaces</span></a>
      <nav>
        <ul id="nav-links">
          <li><a href="../../index.html">Home</a></li>
          <li><a href="../../booking.html">Book</a></li><li><a href="../../products-services.html">Products &amp; Services</a></li><li><a href="../../shopping-store-faqs.html">Shopping &amp; Store FAQs</a></li><li><a href="../../blog/index.html">Blog</a></li>
          <li><a href="../index.html" aria-current="page">Shop</a></li>
          <li><a href="../../index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <button id="hamburger" aria-label="Menu">☰</button>
    </div>
  </header>
  <main>
    <section class="shop-item-page" data-site-id="e624be9b-a0e4-4943-b8d3-70138cd77404" data-item-id="316d3d5a-ce91-43e9-aae7-50e326fedea7" data-app-base-url="https://app.sitehub.co.za">
      <div class="container shop-item-layout">
        <div class="shop-item-shell">
          <div class="shop-item-media">
            <div class="shop-showcase-image-placeholder" aria-hidden="true">Furniture Store</div>
          </div>
          <article class="shop-item-copy">
            <a class="shop-showcase-back-link" href="../index.html">Back to shop</a>
            <p class="shop-showcase-kicker">Products</p>
            <h1>Furniture Store</h1>
            <p class="shop-showcase-price">Quote required</p>
            <p>google_place_1</p>
            
            <div class="shop-item-actions">
              <label>Qty <input id="shop-item-quantity" type="number" min="1" max="99" value="1"></label>
              <button class="cta-button" id="shop-item-add" type="button">Add to cart</button>
            </div>
            <p class="shop-item-status" id="shop-item-status" role="status"></p>
          </article>
        </div>
      </div>
    </section>
  </main>
  <footer>© <span id="year"></span> Pilgrimage Spaces. All rights reserved. | Created by <a href="https://www.sitehub.co.za">SiteHub</a></footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    var hamburger = document.getElementById('hamburger');
    var navLinks = document.getElementById('nav-links');
    if (hamburger && navLinks) hamburger.addEventListener('click', function() { navLinks.classList.toggle('open'); });
    (function() {
      var section = document.querySelector('.shop-item-page');
      var button = document.getElementById('shop-item-add');
      var quantityInput = document.getElementById('shop-item-quantity');
      var status = document.getElementById('shop-item-status');
      if (!section || !button || !quantityInput || !status) return;
      var siteId = section.getAttribute('data-site-id');
      var itemId = section.getAttribute('data-item-id');
      var appBaseUrl = section.getAttribute('data-app-base-url') || '';
      var storageKey = 'sitehub-static-cart-' + siteId;
      function readCart() {
        try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (_) { return {}; }
      }
      function writeCart(cart) { localStorage.setItem(storageKey, JSON.stringify(cart)); }
      async function ensureCart(cart) {
        if (cart.cartId && cart.cartToken) return cart;
        var response = await fetch(appBaseUrl + '/api/public/sites/' + encodeURIComponent(siteId) + '/cart', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'web', website: '' })
        });
        var payload = await response.json();
        if (!response.ok || !payload.success) throw new Error(payload.error || 'Could not start cart');
        return { cartId: payload.data.cartId, cartToken: payload.data.cartToken, expiresAt: payload.data.expiresAt, items: cart.items || {} };
      }
      button.addEventListener('click', async function() {
        button.disabled = true;
        status.textContent = 'Adding item...';
        try {
          var quantity = Math.max(1, Math.min(99, parseInt(quantityInput.value, 10) || 1));
          var cart = await ensureCart(readCart());
          cart.items = cart.items || {};
          cart.items[itemId] = { catalogItemId: itemId, quantity: quantity, variantId: null, selectedOptionIds: [] };
          var items = Object.keys(cart.items).map(function(key) { return cart.items[key]; });
          var updateResponse = await fetch(appBaseUrl + '/api/public/sites/' + encodeURIComponent(siteId) + '/cart/' + encodeURIComponent(cart.cartId), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cartToken: cart.cartToken, website: '', items: items })
          });
          var updatePayload = await updateResponse.json();
          if (!updateResponse.ok || !updatePayload.success) throw new Error(updatePayload.error || 'Could not update cart');
          writeCart(cart);
          status.innerHTML = 'Added to cart. Checkout is handled securely by SiteHub and PayFast when you continue.';
        } catch (error) {
          status.textContent = error && error.message ? error.message : 'Could not add item. Please try again.';
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
